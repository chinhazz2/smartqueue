spring:
  application:
    name: smartqueue-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartqueue}
    username: ${DB_USERNAME:smartqueue}
    password: ${DB_PASSWORD:smartqueue_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: SmartQueue API
    version: 0.1.0